safety:
  require_home_on_start: true
  max_joint_error_rad: 0.05         #Start-up joint error
motion:
  default_segment_duration_s: 15.0  #Time
  default_s_ddot_max: 0.05          #Acceleration
  default_control_rate_hz: 100.0    
stiffness:
  translational_x: 1800.0
  translational_y: 1800.0
  translational_z: 1300.0
  rotational_x: 40.0
  rotational_y: 40.0
  rotational_z: 40.0
  damping_ratio: 0.9
  nullspace_stiffness: 3.0
orientation:
  tilt_sideways_deg: -10 #y
  tilt_forward_deg: 0 #x
  tilt_roll_deg: 0 #z
post_tilt:
  duration_s: 10.0            #Time
  control_rate_hz: 100.0      #Control rate
  
waypoints:
  - name: HOME #0
    offset: [0.0, 0.0, 0.0]


  - name: A4 #4
    offset: [0.27, -0.01, -0.435]
    segment_duration_s: 10.0   
   
  - name: A5 #5
    offset: [0.27, -0.39, -0.435]
    segment_duration_s: 30.0    

  - name: HOME 
    offset: [0.0, 0.0, 0.0]
    segment_duration_s: 10.0

pause_behavior:
  pause_at_indices: [1, 4]
