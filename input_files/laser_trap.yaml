safety:
  require_home_on_start: true
  max_joint_error_rad: 0.05

motion:
  default_segment_duration_s: 15.0
  default_s_ddot_max: 0.05      
  default_control_rate_hz: 100.0 

stiffness:
  translational_x: 1800.0
  translational_y: 1800.0
  translational_z: 1000.0
  rotational_x: 30.0
  rotational_y: 30.0
  rotational_z: 30.0
  damping_ratio: 1.1
  nullspace_stiffness: 1.0

orientation:
  tilt_sideways_deg: 0
  tilt_forward_deg: 0

waypoints:
  - name: HOME
    offset: [0.0, 0.0, 0.0]

  - name: A1
    offset: [0.275, -0.09, -0.20]
    segment_duration_s: 10.0

  - name: A2
    offset: [0.275, 0.28, -0.20]
    segment_duration_s: 30.0

  - name: A3
    offset: [0.275, -0.09, -0.20]
    segment_duration_s: 30.0

  - name: A4
    offset: [0.275, 0.28, -0.20]
    segment_duration_s: 30.0

  - name: HOME
    offset: [0.0, 0.0, 0.0]
    segment_duration_s: 10.0

pause_behavior:
  pause_at_indices: [1, 2, 3, 4]
