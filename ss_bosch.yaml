safety:
  require_home_on_start: true
  max_joint_error_rad: 0.05         #Start-up joint error
motion:
  default_segment_duration_s: 15.0  #Time
  default_s_ddot_max: 0.05          #Acceleration
  default_control_rate_hz: 100.0    #Control rate - controller update frequency
stiffness:
  translational_x: 1300.0
  translational_y: 1300.0
  translational_z: 600.0
  rotational_x: 45.0
  rotational_y: 45.0
  rotational_z: 45.0
  damping_ratio: 0.9
  nullspace_stiffness: 2.0
orientation:
  tilt_sideways_deg: 0
  tilt_forward_deg: 0
  tilt_roll_deg: 0   
post_tilt:
  duration_s: 10.0            #Time
  control_rate_hz: 100.0      #Control rate
 

waypoints:
  - name: HOME
    offset: [0.0, 0.0, 0.0]

  - name: A1 #1
    offset: [0.30, 0.08, -0.42]
    segment_duration_s: 10.0
    
  - name: A2 #2
    offset: [0.30, -0.25, -0.42]
    segment_duration_s: 40.0

  - name: HOME
    offset: [0.0, 0.0, 0.0]

  - name: A3 #3
    offset: [0.24, 0.08, -0.42]   
    segment_duration_s: 10.0
    
  - name: A4 #4
    offset: [0.24, -0.25, -0.42]
    segment_duration_s: 40.0   
  
  - name: HOME 
    offset: [0.0, 0.0, 0.0]
    segment_duration_s: 10.0

pause_behavior:
  pause_at_indices: [1]
  
  
  

 
